<svg id="flow" viewBox="0 0 1280 550" role="img" aria-label="Browser qua Nginx đến Next.js và FastAPI; API ghi SQLite và private storage, worker chấm Docker rồi outbox trả WebSocket" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56728f"></path></marker></defs><rect x="15" y="35" width="200" height="78" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="115" y="64" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">Browser</text><text x="115" y="87" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">Sinh viên / Giảng viên</text><rect x="290" y="35" width="200" height="78" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="390" y="64" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">Nginx :8080</text><text x="390" y="87" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">Origin chung</text><rect x="585" y="8" width="210" height="75" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="690" y="37" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">Next.js :3000</text><text x="690" y="60" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">Hiển thị và thao tác UI</text><rect x="585" y="142" width="210" height="78" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="690" y="171" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">FastAPI :8000</text><text x="690" y="194" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">Auth / LMS / thi / điểm</text><rect x="940" y="135" width="270" height="85" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="1075" y="164" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">SQLite</text><text x="1075" y="187" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">Submission · job · audit · outbox</text><rect x="585" y="325" width="210" height="78" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="690" y="354" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">Private storage</text><text x="690" y="377" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">File · source · test ẩn</text><rect x="940" y="325" width="270" height="78" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="1075" y="354" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">Judge worker</text><text x="1075" y="377" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">Lease · token · retry</text><rect x="940" y="460" width="270" height="75" rx="9" fill="#f4f7fb" stroke="#cbd6e2"></rect><text x="1075" y="489" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#172c4b">Docker sandbox</text><text x="1075" y="512" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" fill="#52677f">Compile 1 lần · run từng test</text><path d="M 215 74 L 290 74" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="228" y="62" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">HTTP</text><path d="M 490 60 L 585 46" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="528" y="42" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">/</text><path d="M 490 92 L 530 92 L 530 180 L 585 180" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="535" y="141" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">/api</text><path d="M 795 180 L 940 180" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="815" y="168" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">Ghi / đọc DB</text><path d="M 690 220 L 690 325" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="705" y="280" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">Upload / đọc file</text><path d="M 1075 325 L 1075 220" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="1087" y="277" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">Claim / kết quả</text><path d="M 940 364 L 795 364" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="810" y="350" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">Đọc source / test</text><path d="M 1075 403 L 1075 460" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)"></path><text x="1087" y="437" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">Chạy</text><path d="M 940 198 L 850 198 L 850 260 L 105 260 L 105 113" fill="none" stroke="#56728f" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"></path><text x="250" y="248" fill="#52677f" font-family="Segoe UI,Arial" font-size="13">Outbox → EventHub → /ws → cập nhật browser</text><text x="22" y="460" fill="#52677f" font-family="Segoe UI,Arial" font-size="15">Cùng máy chủ: API + SQLite + private storage + worker.</text><text x="22" y="490" fill="#52677f" font-family="Segoe UI,Arial" font-size="15">REST snapshot phục hồi trạng thái sau khi mất WebSocket.</text><text x="22" y="520" fill="#52677f" font-family="Segoe UI,Arial" font-size="15">Expected output ở host; chỉ trả kết quả tổng của bài cho sinh viên.</text></svg>